name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    # Both platforms on purpose: Windows is where Pharos is developed and where the live
    # validation runs happened, Linux is where most people will first clone it. fail-fast is
    # off so a platform-specific break is visible as itself rather than cancelling the other.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        # Both supported minors. 3.12 is what development happens on and what the lockfile
        # resolves to by default; 3.13 is what a `pip install pharos` on a current machine
        # will pick, and nothing else here would notice it breaking.
        python: ["3.12", "3.13"]

    runs-on: ${{ matrix.os }}

    steps:
      # Pinned to majors that ship a supported Node runtime, checked against each action's
      # own action.yml rather than assumed from "latest": setup-uv v6 is still node20 and v7
      # is the first node24 major, while the v9 floating tag does not exist at all despite a
      # v9.0.0 release. Both actions were being force-run on Node 24 with a deprecation
      # annotation on every build — a warning today, a broken pipeline once it is enforced.
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      # No GPU and no Ollama on a runner. That is fine: the NVML probe degrades to a labelled
      # fallback, the backend calls are mocked, and the tokenizer tests that need a real GGUF
      # skip themselves because tests/models/ is empty on a fresh clone.
      - name: Sync dependencies
        run: uv sync --frozen --python ${{ matrix.python }}

      - name: Lint
        run: uv run --python ${{ matrix.python }} ruff check .

      - name: Type-check
        run: uv run --python ${{ matrix.python }} mypy pharos

      - name: Test
        run: uv run --python ${{ matrix.python }} pytest -q

      # `.python-version` pins 3.12 for day-to-day work, so every uv call above names the
      # matrix interpreter explicitly. Without that the 3.13 leg silently runs 3.12 and
      # reports green, which is worse than not testing 3.13 at all.
      - name: The interpreter under test is the one asked for
        run: uv run --python ${{ matrix.python }} python -c "import sys; assert '.'.join(map(str, sys.version_info[:2])) == '${{ matrix.python }}', sys.version"

      # `shell: powershell` is Windows PowerShell 5.1 on GitHub runners, which is the point:
      # 5.1 reads a script with no byte-order mark as the ANSI code page, so one em dash in a
      # comment turns every string after it into a parse error. PowerShell 7 decodes the same
      # file as UTF-8 and shows nothing, so testing on a modern host cannot catch it.
      - name: start.ps1 stays ASCII and parses under Windows PowerShell 5.1
        if: runner.os == 'Windows' && matrix.python == '3.12'
        shell: powershell
        run: |
          $bad = Select-String -Path start.ps1 -Pattern '[^\x00-\x7F]'
          if ($bad) {
            $bad | ForEach-Object { Write-Host "non-ASCII on line $($_.LineNumber): $($_.Line)" }
            throw "start.ps1 must stay pure ASCII - see the .NOTES block in the script"
          }
          $errs = $null
          $null = [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path start.ps1).Path, [ref]$null, [ref]$errs)
          if ($errs -and $errs.Count -gt 0) {
            $errs | ForEach-Object { Write-Host $_.Message }
            throw "start.ps1 failed to parse under $($PSVersionTable.PSVersion)"
          }
          Write-Host "start.ps1 ok under $($PSVersionTable.PSVersion)"

      - name: start.sh parses
        if: runner.os == 'Linux' && matrix.python == '3.12'
        run: bash -n start.sh

[project]
name = "pharos"
version = "1.1.3"
description = "Transparent, context-aware orchestration proxy and live terminal dashboard for local LLM backends."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Isaac Jordan", email = "isaaz.jordan02@gmail.com" }]
requires-python = ">=3.12,<3.14"
keywords = ["llm", "ollama", "proxy", "context-window", "tui", "local-llm", "vram"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]

dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "textual>=1.0",
    "rich>=13.7",
    "pydantic>=2.7",
    "nvidia-ml-py>=12.535",
    "llama-cpp-python>=0.3.0",
    "watchfiles>=0.21",
]

[project.scripts]
pharos = "pharos.__main__:main"
pharos-profile = "pharos.profiler.cli:main"
pharos-split = "pharos.preflight.cli:split_main"
[project.urls]
Homepage = "https://github.com/ij-jkl/Pharos"
Repository = "https://github.com/ij-jkl/Pharos"
Issues = "https://github.com/ij-jkl/Pharos/issues"
Changelog = "https://github.com/ij-jkl/Pharos/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pharos"]
# PEP 561: without this marker in the installed package, every type hint in here is invisible
# to anything that imports it, however strictly it is checked in CI.
artifacts = ["pharos/py.typed"]

# Install llama-cpp-python from the prebuilt CPU wheels rather than the PyPI sdist (which would
# need a C++ toolchain). `explicit = true` scopes this index to only the package pinned below,
# so it never interferes with resolving anything else.
[[tool.uv.index]]
name = "llama-cpp-cpu"
url = "https://abetlen.github.io/llama-cpp-python/whl/cpu"
explicit = true

[tool.uv.sources]
llama-cpp-python = { index = "llama-cpp-cpu" }

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# ARG earns its place here: a parameter that stopped being used when a function was
# refactored is invisible in review, and one survived a commit in exactly that way.
select = ["E", "F", "I", "UP", "B", "ASYNC", "SIM", "ARG", "RET", "C4", "PIE"]

[tool.ruff.lint.per-file-ignores]
# Requesting a fixture for its side effect is how pytest is written - `tmp_path` to get a
# scratch directory, an autouse-style fixture named to activate it - and a mock's signature is
# fixed by the thing it impersonates. Enforcing ARG here would buy nothing but noqa noise.
"tests/*" = ["ARG"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

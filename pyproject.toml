[project]
name = "pharos"
version = "0.3.0"
description = "Transparent, context-aware orchestration proxy and live terminal dashboard for local LLM backends."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "textual>=1.0",
    "rich>=13.7",
    "pydantic>=2.7",
    "nvidia-ml-py>=12.535",
    "llama-cpp-python>=0.3.0",
    "watchfiles>=0.21",
]

[project.scripts]
pharos = "pharos.__main__:main"
pharos-profile = "pharos.profiler.cli:main"
pharos-split = "pharos.preflight.cli:split_main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pharos"]

# Install llama-cpp-python from the prebuilt CPU wheels rather than the PyPI sdist (which would
# need a C++ toolchain). `explicit = true` scopes this index to only the package pinned below,
# so it never interferes with resolving anything else.
[[tool.uv.index]]
name = "llama-cpp-cpu"
url = "https://abetlen.github.io/llama-cpp-python/whl/cpu"
explicit = true

[tool.uv.sources]
llama-cpp-python = { index = "llama-cpp-cpu" }

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
